# Nginx конфиг для Laravel + Reverb (WebSocket proxy)
#
# Установка для Docker:
#   Файл должен быть в deploy/nginx/default.conf
#   Docker compose его смонтирует в /etc/nginx/conf.d/default.conf
#
# Для локальной установки без Docker:
#   sudo cp deploy/nginx/default.conf /etc/nginx/sites-available/laravel.conf
#   sudo ln -s /etc/nginx/sites-available/laravel.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Маршруты:
#   / → PHP-FPM (Laravel + Livewire HTTP)
#   /app/* → PHP-FPM (Reverb health endpoint)
#   /wss → Reverb WebSocket (Upgrade: websocket)

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;

    # Логи
    access_log /var/log/nginx/laravel-access.log;
    error_log  /var/log/nginx/laravel-error.log;

    # === Главная маршрутизация → PHP-FPM ===
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # === Статика (кеш 30 дней) ===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # === PHP-FPM ===
    location ~ \.php$ {
        fastcgi_pass app:9000;  # Имя сервиса из docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffering off;  # Для Livewire streaming
    }

    # === Reverb WebSocket (wss://) ===
    # ВАЖНО: путь /app/{key}/wss — это Reverb endpoint
    location /app {
        proxy_pass http://supervisor:8081;  # Имя сервиса supervisor из docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # 24 часа — WebSocket keepalive
    }

    # === Reverb health endpoint ===
    location /up {
        proxy_pass http://supervisor:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

; Laravel Queue Worker — обработка jobs из Redis
;
; Установка:
;   sudo cp deploy/supervisor/laravel-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker
;
; Логи: /var/log/supervisor/laravel-worker.log
; Статус: sudo supervisorctl status laravel-worker
;
; ВАЖНО: при деплое нового кода — перезапустить воркер:
;   sudo supervisorctl restart laravel-worker
; (чтобы подхватить изменения в коде)
;
; Очереди по приоритету:
;   default  — обычные jobs (high priority)
;   realtime — broadcast events (LoadingCompleted, DriverRouteUpdated, ZoneFillWarning)
;   ai       — долгие задачи (analyze fleet, predict maintenance)
;
; Параметры:
;   --tries=3     — максимум 3 попытки (после — failed_jobs)
;   --backoff=60  — ждать 60 сек перед retry (exponential: 60, 120, 240)
;   --max-time=3600 — перезапуск воркера каждый час (memory leak prevention)
;   --memory=128   — перезапуск если превышен memory limit 128 MB

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /opt/lampp/htdocs/lavue/artisan queue:work redis --queue=default,realtime,ai --tries=3 --backoff=60 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30

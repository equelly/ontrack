; Laravel Queue Worker — обработка jobs из Redis (ВНУТРИ DOCKER)
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
; ИСПРАВЛЕНО: путь к artisan изменен на докер-директорию /var/www/html/artisan
command=php /var/www/html/artisan queue:work --connection=redis --queue=broadcasts,realtime,default,ai --tries=3 --backoff=60 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; ИСПРАВЛЕНО: в докер-контейнерах процессы обычно запускаются от root, либо проверьте пользователя вашего Dockerfile
user=root
numprocs=2
redirect_stderr=true
; ИСПРАВЛЕНО: пути к логам перенаправлены в примонтированный storage/logs, чтобы они не стирались при перезапуске контейнера
stdout_logfile=/var/www/html/storage/logs/supervisor-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30

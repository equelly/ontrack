; Laravel Reverb WebSocket Server — real-time коммуникация
;
; Установка:
;   sudo cp deploy/supervisor/laravel-reverb.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-reverb
;
; Логи: /var/log/supervisor/laravel-reverb.log
; Статус: sudo supervisorctl status laravel-reverb
;
; Проверка что работает:
;   curl http://localhost:8081/up/app/REVERB_APP_KEY
;   (должен вернуть 101 Switching Protocols или подобный ответ)
;
; ВАЖНО: при деплое — Reverb НЕ нужно перезапускать (он не хранит состояние).
; Только если обновили Reverb-пакет.
;
; Порт 8081 — чтобы не конфликтовать с PHP-FPM/Livewire.
; В .env: REVERB_PORT=8081
;
; ВАЖНО: для prod — обязательно за Nginx с TLS (wss://).
; Это конфиг barebone без TLS — для dev.

[program:laravel-reverb]
process_name=%(program_name)s
command=php /opt/lampp/htdocs/lavue/artisan reverb:start --port=8081 --host=127.0.0.1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10

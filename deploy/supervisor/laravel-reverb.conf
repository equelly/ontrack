; Laravel Reverb WebSocket Server (ВНУТРИ DOCKER)
[program:laravel-reverb]
process_name=%(program_name)s
; ИСПРАВЛЕНО: путь к artisan изменен на /var/www/html/artisan
; ИСПРАВЛЕНО: --host изменен на 0.0.0.0, чтобы Reverb принимал внешние подключения из сети Docker и от планшетов
command=php /var/www/html/artisan reverb:start --port=8081 --host=0.0.0.0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
; ИСПРАВЛЕНО: логи перенаправлены в storage/logs для удобства чтения на хост-машине
stdout_logfile=/var/www/html/storage/logs/supervisor-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10

# docker-compose для прода/карьера.
# Запуск: docker compose up -d
#
# Сервисы:
#   - app (PHP-FPM + Laravel) — порт 9000 (для nginx)
#   - nginx (reverse proxy) — порт 8080 (HTTP), можно добавить 443
#   - mysql — порт 3306 (для dev; в prod — внутренний)
#   - redis — порт 6379 (для dev; в prod — внутренний)
#   - reverb — порт 8081 (websocket)
#   - supervisor — queue workers + reverb (в одном контейнере с app)
#
# ВАЖНО: перед запуском — создай .env (можно скопировать .env.example)
# и заполни APP_KEY, REVERB_APP_KEY, DB_PASSWORD.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - laravel-network
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - REVERB_HOST=reverb

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-network

  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # В проде — раскомментируй и задай пароль:
    # command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

  # Queue workers + Reverb — в одном контейнере с supervisor
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-supervisor
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]
    volumes:
      - ./:/var/www/html
      - ./deploy/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf
      - ./deploy/supervisor/laravel-worker.conf:/etc/supervisor/conf.d/laravel-worker.conf
      - ./deploy/supervisor/laravel-reverb.conf:/etc/supervisor/conf.d/laravel-reverb.conf
    networks:
      - laravel-network
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8081
    ports:
      - "8081:8081"  # Reverb WebSocket

networks:
  laravel-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
